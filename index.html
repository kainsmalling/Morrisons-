<style>
:root{--bg:#f4f4f4;--fg:#111;--card:#fff;--line:#ddd;--mut:#666;--acc:#00703c;--chip:#e6e6e6}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}

.empty{color:var(--mut);padding:24px 0}

let cat="All",q="";
const $=id=>document.getElementById(id);
const cats=["All","Most bought",...[...new Set(ITEMS.map(i=>i.category))].sort()];
function card(i){return `<div class="card" data-e="${i.ean}"><div class="bc">${i.svg}</div><div class="nm">${i.name}${i.size?" "+i.size:""}</div><div class="sub">${i.category} · bought ${i.units}×</div></div>`}
function render(){
  $("chips").innerHTML=cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
  const t=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let l=ITEMS.filter(i=>t.every(w=>(i.name+" "+i.size+" "+i.aliases+" "+i.category).toLowerCase().includes(w)));
  const by=(a,b)=>b.receipts-a.receipts||b.units-a.units||a.name.localeCompare(b.name);
  let h="";
  if(cat==="Most bought"){l=l.sort(by).slice(0,20);h=`<h2>Most bought</h2><div class="grid">${l.map(card).join("")}</div>`}
  else{
    if(cat!=="All")l=l.filter(i=>i.category===cat);
    l.sort(by);
    if(cat==="All"&&!t.length){h+=`<h2>Most bought</h2><div class="grid">${[...l].slice(0,8).map(card).join("")}</div><h2>All items</h2>`}
    h+=`<div class="grid">${(cat==="All"&&!t.length?[...l].sort((a,b)=>a.name.localeCompare(b.name)):l).map(card).join("")}</div>`;
  }
  $("main").innerHTML=l.length?h:`<div class="empty">Nothing found.</div>`;
}
$("q").oninput=e=>{q=e.target.value;render()};
$("chips").onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};
$("main").onclick=e=>{const c=e.target.closest(".card");if(!c)return;const i=ITEMS.find(x=>x.ean===c.dataset.e);
  $("big").innerHTML=i.svg+`<div class="n">${i.ean}</div><div class="t">${i.name}${i.size?" "+i.size:""}</div>`;$("ov").classList.add("on")};
$("ov").onclick=()=>$("ov").classList.remove("on");
render();
</script></body></html>
